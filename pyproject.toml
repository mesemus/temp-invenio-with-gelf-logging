[project]
name = "gelf-test-instance"
description = "Add your description here"
readme = "README.md"
version = "14.0.0"
requires-python = "~= 3.14.0"

dependencies = [
  "invenio-app-rdm[opensearch2]~=14.0.0",
  "uwsgi>=2.0",
  "uwsgitop>=0.11",
  "uwsgi-tools>=1.1.1",
  "lxml-html-clean>=0.1.1",
  "gelf-test",
  "invenio-audit-logs",
  "pygelf>=0.4.3",
]

[tool.uv]
override-dependencies = ["invenio-audit-logs", "invenio-accounts", "invenio-i18n", "invenio-indexer", "invenio-administration", "invenio-records-resources"]

[tool.uv.sources]
"gelf-test" = { workspace = true }
"invenio-audit-logs" = { git = "https://github.com/oarepo/invenio-audit-logs", branch = "contribution-service-components" }

[tool.uv.workspace]
members = ["site"]

[project.optional-dependencies]
tests = [
  "pytest-invenio>=4.0.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
